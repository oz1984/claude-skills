<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mozury Facebook Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kufam:wght@600;700&family=Cairo:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --deep:#0A2E26; --green:#0F3D33; --soft:#1B5245; --cream:#F7F3E8; --gold:#D9A441; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #06201a; color: var(--cream); font-family: 'IBM Plex Sans Arabic', sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 24px 16px 40px; }
  #cover { width: 100%; max-width: 1640px; line-height: 0; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  #cover svg { display: block; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
  button, label.btn { font: 600 15px 'IBM Plex Sans Arabic', sans-serif; border-radius: 999px; padding: 11px 22px; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--gold); color: var(--deep); }
  .primary:disabled { opacity: .6; cursor: progress; }
  .ghost { background: transparent; color: var(--cream); border-color: rgba(247,243,232,.3); }
  .ghost input { display: none; }
  .note { font-size: 13px; opacity: .7; text-align: center; max-width: 720px; line-height: 1.6; margin: 0; }
  a { color: var(--gold); }
</style>
</head>
<body>
  <div id="cover"></div>
  <div class="bar">
    <button class="primary" id="dl">Download PNG (1640 × 924)</button>
    <label class="btn ghost">Choose logo file…<input type="file" id="logoFile" accept="image/png,image/svg+xml,image/webp"></label>
    <a class="btn ghost" href="preview.html" style="text-decoration:none;padding:11px 22px;border:1px solid rgba(247,243,232,.3);border-radius:999px;color:var(--cream);font-weight:600;font-size:15px">Crop preview →</a>
  </div>
  <p class="note" id="status"></p>

<script src="cover-art.js"></script>
<script>
(function () {
  var M = window.MozuryCover, box = document.getElementById('cover'), status = document.getElementById('status');
  function draw() { box.innerHTML = M.buildSVG({ idPrefix: 'cv', logo: M.state.logoSrc }); }
  function say() {
    if (!M.state.logoSrc) status.innerHTML = 'Logo not found at “' + M.LOGO_FILE + '” next to this file, so a typeset wordmark is shown. Use “Choose logo file…” to load mozury-logo-cream-transparent.png.';
    else if (!M.state.logoDataURL) status.innerHTML = 'Logo found. Your browser blocks embedding local files in an export when the page is opened from disk, so the download will ask you to pick the logo file once (or serve this folder, e.g. <code>python3 -m http.server</code>).';
    else status.textContent = 'Logo loaded. The download is rendered at exactly 1640 × 924.';
  }
  draw(); say();
  M.findLogo().then(function () { draw(); say(); });

  var fileInput = document.getElementById('logoFile');
  fileInput.addEventListener('change', function () {
    if (!fileInput.files[0]) return;
    M.setLogoFromFile(fileInput.files[0]).then(function () { draw(); say(); if (pendingDownload) { pendingDownload = false; go(); } });
  });

  var pendingDownload = false, btn = document.getElementById('dl');
  function go() {
    btn.disabled = true; btn.textContent = 'Rendering…';
    M.downloadPNG().catch(function (e) { status.textContent = 'Export failed: ' + e.message; })
      .then(function () { btn.disabled = false; btn.textContent = 'Download PNG (1640 × 924)'; });
  }
  btn.addEventListener('click', function () {
    if (M.state.logoSrc && !M.state.logoDataURL) { pendingDownload = true; fileInput.click(); return; }
    go();
  });
})();
</script>
</body>
</html>
